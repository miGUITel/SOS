<script>/* Modelo didáctico, no inventario ni calculadora de huella certificada. */
(function () {
  'use strict';
  const scenario = Object.freeze({
    id: 'oficina-es-v1', employees: 20, workdays: 220, hours: 8,
    commuteKm: 16, officeAreaM2: 120, heatingDays: 120,
    appUsers: 1000, actionsPerUser: 20, hardwareYears: 4,
    electricityKgPerKWh: 0.107, gasKgCO2PerKWhPCI: 0.20196,
    heatingThermalKWh: 7200, boilerEfficiency: 0.90,
    appGridKgPerKWh: 0.107, dataCenterPUE: 1.3,
    networkKWhPerGB: 0.001, aiWhPerRequest: 0.24
  });
  const scenarioSummary = [
    'Oficina ficticia española: veinte personas, ocho horas de jornada y 220 días laborables al año.',
    'El desplazamiento, la pausa y la tarea de programación corresponden a una persona y un puesto. La sala compartida se cuenta una sola vez; no se multiplica por veinte.',
    'La aplicación completa atiende a 1.000 usuarios por día laborable, con veinte operaciones útiles por usuario. El servidor de pruebas es distinto de la infraestructura de producción.',
    'El portátil de la decisión de compra es un aparato auxiliar distinto del puesto de pausa y de los dos aparatos retirados. La comparación de compra incluye solo fabricación, transporte y reparación, anualizados en cuatro años.',
    'Electricidad: referencia fija de 0,107 kg CO₂e/kWh, basada en el etiquetado de generación nacional de la CNMC para 2025. No es un dato en tiempo real ni el factor de una comercializadora concreta.',
    'Distancias, potencias, horarios, demanda de calefacción, tiempos de programación y carga de la aplicación son supuestos del caso; no se han medido en un aula o una empresa real.',
    'Los intervalos son rangos de sensibilidad del modelo, no intervalos estadísticos de confianza. Se mantiene la misma versión del modelo entre los dos intentos.'
  ];
  const sources = [
    {id:'electricity',label:'CNMC: etiquetado de electricidad 2025',url:'https://www.cnmc.es/en/node/420337',note:'Referencia fija de generación nacional de 107 g CO₂e/kWh; expediente GDO/DE/001/26. Se contrasta con el etiquetado publicado por Barcelona Energia, que identifica esa media nacional. No se aplica un factor cero por garantías de origen.'},
    {id:'electricity-label',label:'Etiquetado 2025: media nacional',url:'https://www.barcelonaenergia.cat/documents/20121/1772997/Etiquetado%2BElectricidad%2B2025.pdf',note:'Documento de la comercializadora pública que muestra 107 g CO₂e/kWh como media nacional de generación. El modelo adopta ese valor como referencia fija española, no el factor comercial de Barcelona Energia.'},
    {id:'fuel',label:'MITECO: factores de combustibles, edición 2026',url:'https://www.miteco.gob.es/content/dam/miteco/es/calidad-y-evaluacion-ambiental/temas/sistema-espanol-de-inventario-sei-/inventario-gases-efecto-invernadero/AV4-FE-CO2-PCI-combustibles-2026.pdf',note:'Gas natural: 56,10 kg CO₂/GJ PCI, equivalentes a 0,20196 kg CO₂/kWh PCI. Gasóleo: 74,10 kg CO₂/GJ y 43 GJ/t; con densidad del escenario 0,832 kg/L resulta 2,6502 kg CO₂/L. Se modela combustión, sin extracción/refino ni fabricación de vehículos.'},
    {id:'idae',label:'IDAE: ahorro energético e iluminación',url:'https://www.idae.es/ahorra-energia/recomendaciones-para-el-ahorro-energetico-en-hogares',note:'Aprovechamiento de luz natural y adecuación de la climatización. El incremento aproximado del 7 % por grado orienta el caso, pero no es una ley para todos los edificios: se ensaya 10–20 % para dos grados, con 14 % central.'},
    {id:'sci',label:'Green Software Foundation: Software Carbon Intensity',url:'https://sci.greensoftware.foundation/',note:'Comparar el mismo servicio, declarar componentes y supuestos, y combinar energía con intensidad de carbono. La simulación no es una evaluación completa conforme a SCI.'},
    {id:'network',label:'Impact Framework: ejemplo de energía de red',url:'https://if.greensoftware.foundation/pipelines/sci/',note:'El tutorial utiliza 0,001 kWh/GB. Aquí es una aproximación contable, con sensibilidad 0,0005–0,01 kWh/GB: reducir bytes no equivale a reducir proporcionalmente el consumo real de la red a corto plazo.'},
    {id:'ai',label:'Google: medición de inferencia de IA, 2025',url:'https://arxiv.org/abs/2508.15734',note:'Mediana de 0,24 Wh por petición de texto en Gemini Apps, mayo de 2025, incluyendo infraestructura de servicio. No es un factor universal de programación. El caso ensaya 0,1–5 Wh por petición, además del puesto; no incluye entrenamiento ni fabricación del sistema de IA.'},
    {id:'hardware',label:'Dell Pro 13 Premium PA13250: ciclo de vida',url:'https://www.delltechnologies.com/asset/en-us/products/laptops-and-2-in-1s/technical-support/dell-pro-13-premium-pa13250-pcf-report.pdf',note:'Informe de enero de 2025: 101 kg CO₂e de ciclo de vida, con aproximadamente 73 kg de fabricación y 4 kg de transporte. Se usan solo esos 77 kg para la compra; se excluye aquí el uso y el fin de vida. Reparación: supuesto del caso de 10 kg, sensibilidad 5–20 kg. La sensibilidad de compra ±30 % es didáctica, no un intervalo publicado por Dell.'},
    {id:'raee',label:'BOE: RD 110/2015, artículo 13',url:'https://www.boe.es/buscar/act.php?id=BOE-A-2015-1762#a13',note:'Segundo uso cuando es posible y entrega como RAEE cuando el aparato resulta inutilizable. No se inventa una reducción de carbono para estas dos decisiones.'},
    {id:'case',label:'Supuestos explícitos de la oficina ficticia',url:'',note:'Sala de 120 m²; 360 W de iluminación, con 180 W evitables durante cuatro horas; 7.200 kWh térmicos/año a consigna moderada y caldera de gas al 90 %. Puesto: 60 W activo, 3 W suspendido y pantalla de 20 W. Servidor de pruebas: 60 W. Software: CPU de 40 W durante 0,4 o 0,1 s por petición, más parte fija de infraestructura de 10 W y PUE 1,3. Procesamiento del navegador: 20 W durante 0,01 s por MB, aproximadamente 0,0556 Wh/GB. Tiempos y potencias construidos para el caso, no mediciones presentadas como reales.'}
  ];
  const option = (id,label,description) => ({id,label,description});
  const decisions = {
    commute: {
      page:'travel', title:'Cómo llegar al trabajo',
      context:'Cada día recorres ocho kilómetros de ida y ocho de vuelta. Las cuatro alternativas están disponibles y te permiten llegar a tiempo en las condiciones del caso.',
      help:'La bici tiene una ruta practicable. El coche diésel consume 6 L/100 km. En el coche compartido viajan tres personas sin desvío. El autobús del caso consume 30 L/100 km y lleva veinte pasajeros. Su ocupación introduce incertidumbre.',
      scope:'Una persona, dieciséis kilómetros por día laborable.',
      options:[option('bike','Bicicleta','Ruta practicable y tiempo suficiente.'),option('bus','Autobús','Servicio compatible con el horario; compartes el vehículo con otros pasajeros.'),option('carpool','Coche compartido','Tres personas, mismo destino y sin desvío.'),option('solo','Coche individual','El trayecto completo atiende a una persona.')]
    },
    lighting: {
      page:'room',title:'Iluminación de la oficina',
      context:'Durante cuatro horas, la luz natural ilumina la mitad de los puestos cuando se ajustan las persianas. En las demás zonas y horas se utiliza iluminación artificial. El caso proporciona iluminación suficiente en ambas configuraciones.',
      help:'Todas las luminarias suman 360 W. La configuración por zonas mantiene 180 W durante las cuatro horas con luz natural y 360 W durante el resto de la jornada.',
      scope:'Sala compartida de veinte puestos.',
      options:[option('all','Persianas bajadas e iluminación artificial','Todas las luminarias permanecen encendidas durante la jornada.'),option('daylight','Persianas ajustadas e iluminación por zonas','La mitad de las luminarias se mantiene encendida durante las cuatro horas con luz natural; después se encienden todas.')]
    },
    heating: {
      page:'room',title:'Temperatura y vestimenta',

    },
    waste: {
      page:'equipment',title:'Gestionar el aparato inutilizable',

      help:'El artículo 13.2 del RD 110/2015 indica la entrega como RAEE cuando no procede el segundo uso. Esto no excluye una recuperación posterior de componentes o materiales en el circuito de gestión adecuado.',

  };
  const referenceAnswers = Object.freeze({commute:'solo',lighting:'all',heating:'high',pause:'on',payload:'all',refresh:'frequent',processing:'naive',devserver:'always',ai:'manual',hardware:'new',reuse:'raee',waste:'mixed'});
  const interval = (low,central,high) => ({low,central,high});

  function selection(answers,key) {
    let value=answers && answers[key];

    return value;
  }
  function calculate(answers,overrides) {
    overrides=overrides||{};
    const rawDays=overrides.workdays===undefined?scenario.workdays:Number(overrides.workdays);

    if(!Number.isFinite(rawUsers)||rawUsers<1||rawUsers>1000000)throw new Error('Usuarios fuera de rango.');
    const days=rawDays,users=rawUsers,ratio=days/scenario.workdays;
    const a={};Object.keys(decisions).forEach(k=>a[k]=selection(answers,k));
    const rows=[],checks=[];
    const row=(id,label,scope,reference,chosen,explanation,sourceIds)=>rows.push({id,label,scope,reference,chosen,explanation,sourceIds,unit:'kg CO₂e/año'});

    // Transporte: emisiones de combustión asignadas al pasajero; no ciclo de vida.

    const km=16*days;
    const car=interval(km*0.05*dieselKgPerL,km*0.06*dieselKgPerL,km*0.07*dieselKgPerL);

    if(a.commute==='bike')travel=fixed(0);
    if(a.commute==='carpool')travel=scale(car,1/3);
    if(a.commute==='bus')travel=interval(km*0.25*dieselKgPerL/30,km*0.30*dieselKgPerL/20,km*0.35*dieselKgPerL/10);
    row('commute','Desplazamiento','Una persona; 16 km por día laborable.',car,travel,'Se estima la combustión del combustible, no la fabricación de los vehículos, las infraestructuras ni alimentación. La bicicleta tiene cero emisiones de combustión en este límite, no huella de ciclo de vida cero. Compartir reparte el mismo viaje entre tres: no prueba que se hayan evitado exactamente otros dos viajes. El intervalo del bus cambia consumo y ocupación.',['fuel','case']);

    const lightReference=0.360*8*days;
    const lightChosen=a.lighting==='daylight'?lightReference-0.180*4*days:lightReference;
    row('lighting','Iluminación','Sala completa; ocho horas por día de actividad.',electricity(lightReference),electricity(lightChosen),'Se evitan 180 W durante cuatro horas cuando se aprovecha la luz natural; las restantes luces y horas siguen consumiendo. La sala se cuenta una vez. Potencias y horas son datos del caso.',['electricity','electricity-label','idae','case']);

    const thermal=7200*ratio;
    const moderate=interval(thermal*0.8/0.95*scenario.gasKgCO2PerKWhPCI,thermal/0.90*scenario.gasKgCO2PerKWhPCI,thermal*1.2/0.85*scenario.gasKgCO2PerKWhPCI);
    const high=interval(moderate.low*1.10,moderate.central*1.14,moderate.high*1.20);
    row('heating','Calefacción','Sala completa y temporada de ocupación; caldera de gas.',high,a.heating==='moderate'?moderate:high,'La demanda a 20 °C es un supuesto anual de 7.200 kWh térmicos. Subir a 22 °C añade un 14 % central, con sensibilidad 10–20 %. El intervalo también varía demanda ±20 % y rendimiento 85–95 %. No es una ley por grado ni una medida real. Abrigarse sin modificar el sistema mantiene el consumo de la consigna alta. Se cuenta la combustión del gas, sin cadena previa.',['fuel','idae','case']);

    const pauseWh={suspend:23,on:80,screen:60,after:17.25}[a.pause];
    row('pause','Pausa del puesto','Un puesto y una pausa por día laborable.',electricity(80/1000*days),electricity(pauseWh/1000*days),'Referencia: (60 + 20) W × 1 h. Pantalla apagada: 60 Wh. Esperar a la copia y suspender: 60 W × 0,25 h + 3 W × 0,75 h = 17,25 Wh. Suspender al inicio consume 3 Wh durante la pausa y se añaden 20 Wh para recuperar quince minutos de tarea después: total 23 Wh. Esta última opción retrasa el servicio y no cumple el plazo.',['electricity','case']);
    checks.push({id:'pause',label:'Continuidad de la copia',status:a.pause==='suspend'?'review':'ok',message:a.pause==='suspend'?'La copia no está terminada al volver. Se ha contado su recuperación posterior, pero se incumple el plazo del caso.':'La copia puede terminar durante la pausa y debe comprobarse antes de suspender.'});

    // Una sola fila conjunta: tamaño de respuesta × peticiones × proceso interno.
    function appEnergy(config) {
      const actions=users*20*days;
      const requests=actions*(config.refresh==='frequent'?10:1);
      const responseGB=config.payload==='all'?0.002:0.00005;
      const gb=requests*responseGB;
      const seconds=config.processing==='naive'?0.4:0.1;
      const cpuKWh=requests*40*seconds/3600000;
      const fixedIT=10*24*365/1000; // Parte fija asignada al servicio, no a las peticiones.
      const server=interval((fixedIT*0.5+cpuKWh*0.5)*1.15,(fixedIT+cpuKWh)*1.3,(fixedIT*2+cpuKWh*2)*1.6);
      const network=interval(gb*0.0005,gb*0.001,gb*0.01);
      const browser=interval(gb*0.0278/1000,gb*0.0556/1000,gb*0.1112/1000);
      return {kWh:plus(server,network,browser),actions,requests,gb};
    }
    const appRef=appEnergy(referenceAnswers),appChosen=appEnergy(a);
    row('app','Aplicación en producción','Servicio completo; '+users.toLocaleString('es-ES')+' usuarios y veinte operaciones útiles por usuario y día.',electricity(appRef.kWh),electricity(appChosen.kWh),'Se combinan tamaño de respuesta, frecuencia y procesamiento en una única configuración: no se suman ahorros aislados. Incluye una parte fija de infraestructura de 10 W, CPU de 40 W durante 0,4 o 0,1 s, PUE central 1,3, red a 0,001 kWh/GB y procesamiento del navegador. Son parámetros de un modelo didáctico, no mediciones. La sensibilidad ensaya red 0,0005–0,01 kWh/GB y factores de cómputo. La red se asigna contablemente por GB; no representa ahorro marginal garantizado al reducir tráfico. Se omite fabricación de esa infraestructura.',['sci','network','electricity','case']);

    const testRefKWh=0.060*24*365;
    const testChosenKWh=a.devserver==='schedule'?0.060*8*days+0.010*days:testRefKWh;
    row('devserver','Servidor de pruebas','Servidor independiente de producción; año completo.',electricity(testRefKWh),electricity(testChosenKWh),'Servidor del caso a 60 W. Siempre activo: 8.760 horas/año. Con horario: ocho horas por día laborable, más 0,010 kWh de arranque por día. No hay servicios ni tareas necesarias fuera de ese horario. Se omite fabricación del servidor en ambas alternativas.',['electricity','case']);

    function programming(choice) {
      const minutes={manual:60,focused:30,repeated:45}[choice];
      const queries={manual:0,focused:3,repeated:30}[choice];
      const local=interval(0.064*minutes/60*days*0.8,0.080*minutes/60*days,0.096*minutes/60*days*1.2);
      const inference=interval(queries*0.1/1000*days,queries*0.24/1000*days,queries*5/1000*days);
      return electricity(plus(local,inference));
    }
    row('ai','Tarea de programación y ayuda de IA','Una tarea correcta por día laborable; periodo distinto de la pausa.',programming('manual'),programming(a.ai),'El tiempo de trabajo (60, 30 o 45 minutos) y las peticiones (0, 3 o 30) son supuestos de tres procedimientos que alcanzan el mismo resultado. Se cuenta el puesto a 80 W y la inferencia; el caso aplica el mismo factor eléctrico español a ambos, sin afirmar que un proveedor concreto opere en España. 0,24 Wh es una mediana de texto publicada, no una medida de programación. Se ensayan 0,1–5 Wh por petición y variación de tiempo/potencia. Los rangos pueden solaparse: no hay ganador universal. Se excluyen entrenamiento, fabricación y otras búsquedas/documentación fuera del procedimiento definido.',['ai','electricity','case']);

    const buy=interval(77*0.7/4,77/4,77*1.3/4);
    const repair=interval(5/4,10/4,20/4);
    row('hardware','Compra y mantenimiento de un portátil','Un portátil auxiliar; fabricación y mantenimiento repartidos entre cuatro años.',buy,a.hardware==='keep'?repair:buy,'Compra: 73 kg CO₂e de fabricación y 4 kg de transporte de un modelo Dell de referencia, divididos entre cuatro años. Sensibilidad didáctica ±30 %, no intervalo del fabricante. Mantenimiento: 10 kg totales del caso (5–20 kg), también divididos entre cuatro. Se supone que el aparato actual puede prestar el mismo servicio durante ese horizonte. No se vuelve a contar aquí electricidad; tampoco se incluyen créditos de reciclaje ni fin de vida. Las emisiones históricas de fabricación del aparato actual no se vuelven a producir por conservarlo.',['hardware','sci','case']);

    checks.push({id:'reuse',label:'Aparato funcional',status:a.reuse==='reuse'?'ok':'review',message:a.reuse==='reuse'?'El segundo uso viable y confirmado responde al artículo 13.1. Su reducción climática no está estimada: no se añade un ahorro inventado al total.':a.reuse==='raee'?'Existe un segundo uso viable: revisa la retirada directa como residuo frente al artículo 13.1. Huella del destino no estimada.':'Almacenar indefinidamente no concreta el segundo uso confirmado. Revisa la actuación; huella del destino no estimada.'});
    checks.push({id:'waste',label:'Aparato inutilizable',status:a.waste==='gestor'?'ok':'review',message:a.waste==='gestor'?'La entrega por el canal de RAEE responde al artículo 13.2. Se conserva el justificante; la reducción climática no está estimada.':a.waste==='donate'?'Donar como utilizable no resuelve los daños. El caso requiere entrega como RAEE según el artículo 13.2.':'El contenedor de residuos mezclados no es el canal de RAEE previsto por el caso. Revisa la actuación conforme al artículo 13.2.'});
    for(const r of rows)for(const bucket of [r.reference,r.chosen])if(![bucket.low,bucket.central,bucket.high].every(Number.isFinite)||bucket.low<0||bucket.low>bucket.central||bucket.central>bucket.high)throw new Error('Resultado de modelo inválido: '+r.id);
    return {
      rows,checks,
      notes:[
        'Los resultados son estimaciones de partes seleccionadas del caso, no la huella completa de una persona ni de una empresa. Todas las filas numéricas se expresan por año para comparar órdenes de magnitud; cada una conserva su alcance.',
        'El conjunto incluye una persona viajando y un puesto, una sala compartida, una aplicación completa, un servidor de pruebas y una compra anualizada. No se multiplica todo por veinte ni se presenta como un inventario corporativo completo.',
        'Electricidad: factor español fijo de 2025. Combustibles: CO₂ de combustión, sin extracción/refino, otros GEI o fabricación de vehículos. Hardware: solo compra y mantenimiento. Estos límites impiden interpretar el conjunto como una evaluación de ciclo de vida homogénea.',
        'Los intervalos muestran sensibilidad a supuestos del escenario, no probabilidades ni márgenes estadísticos. Un orden de prioridad puede cambiar si los intervalos se solapan.',
        'Los aparatos de segundo uso y RAEE no aportan cero emisiones ni cero ahorro: su efecto climático está sin estimar y se mantiene separado de las cifras.',
        'La comparación entre intentos conserva condiciones y versión del modelo. Los experimentos de usuarios o días son exploraciones aparte y no reescriben las simulaciones guardadas.'
      ],
      scenario:{...scenario,workdays:days,appUsers:users},
      appActivity:{reference:{actions:appRef.actions,requests:appRef.requests,gb:appRef.gb},chosen:{actions:appChosen.actions,requests:appChosen.requests,gb:appChosen.gb}}
    };
  }
  window.SOSModel={version:'2.0.0',scenario,scenarioSummary,sources,decisions,referenceAnswers,calculate};
})();

<script>'use strict';
(() => {

  const empty=()=>({format:FORMAT,modelVersion:M.version,active:newAttempt(),reference:null,lastCompleted:null});
  let state=empty(), blocked=false,saveTimer,toastTimer;
  let experiment={appUsers:M.scenario.appUsers,workdays:M.scenario.workdays};
  const a=()=>state.active;
  const count=()=>keys.filter(k=>a().answers[k]).length;
  const label=(key,value)=>M.decisions[key].options.find(o=>o.id===value)?.label||'Sin responder';
  const button=(label,action,kind='primary',attr='')=>`<button type="button" class="btn ${kind}" data-action="${action}" ${attr}>${label}</button>`;

  function checkAnswers(answers,complete=false){
    if(!answers||typeof answers!=='object'||Array.isArray(answers))throw Error('Respuestas no válidas.');

  }
  function safeTextMap(input,allowed){const out={};for(const k of allowed)if(typeof input?.[k]==='string')out[k]=input[k].slice(0,4000);return out;}
  function checkRange(x){if(!x||!['low','central','high'].every(k=>Number.isFinite(x[k])&&x[k]>=0)||x.low>x.central||x.central>x.high)throw Error('El archivo contiene un resultado numérico no válido.');return {low:x.low,central:x.central,high:x.high};}
  function checkResult(result){
    const expected=['commute','lighting','heating','pause','app','devserver','ai','hardware'];
    if(!result||!Array.isArray(result.rows)||result.rows.length!==expected.length||!Array.isArray(result.checks)||result.checks.length!==3)throw Error('Resultados incompletos.');

    const rows=result.rows.map(r=>{if(!expected.includes(r.id)||ids.has(r.id))throw Error('Resultados duplicados o desconocidos.');ids.add(r.id);return {id:r.id,label:String(r.label||'').slice(0,500),scope:String(r.scope||'').slice(0,1000),reference:checkRange(r.reference),chosen:checkRange(r.chosen),explanation:String(r.explanation||'').slice(0,6000),sourceIds:Array.isArray(r.sourceIds)?r.sourceIds.filter(x=>typeof x==='string').slice(0,30):[]};});

  function checkSnapshot(s){

  function readReflection(r){return {priorities:Array.from({length:3},(_,i)=>typeof r?.priorities?.[i]==='string'?r.priorities[i].slice(0,100):''),reason:typeof r?.reason==='string'?r.reason.slice(0,4000):'',robust:typeof r?.robust==='string'?r.robust.slice(0,4000):''};}
  function validate(input){
    if(!input||![FORMAT,'sos-ra5-comparison-v2'].includes(input.format)||input.modelVersion!==M.version||!input.active)throw Error('La copia corresponde a otro formato o versión.');
    const x=empty();x.active={id:typeof input.active.id==='string'?input.active.id.slice(0,100):newAttempt().id,page:pages.some(p=>p.id===input.active.page)?input.active.page:'intro',answers:checkAnswers(input.active.answers),reasons:safeTextMap(input.active.reasons,keys),prediction:safeTextMap(input.active.prediction,prediction.map(x=>x[0])),finished:input.active.finished===true,reflection:readReflection(input.active.reflection)};

  try{const raw=localStorage.getItem(KEY);if(raw)state=validate(JSON.parse(raw));}catch(e){blocked=true;}

  function capture(){

  function intro(){

    <section class="card hero-grid"><div><h2>Tu misión</h2><p>Formas parte de un equipo informático. Hoy vas a decidir cómo desplazarte, preparar la sala, gestionar tu puesto y construir una aplicación.</p><p>Al final verás las estimaciones, podrás imprimir un informe y repetir el recorrido para comparar tus decisiones bajo las mismas condiciones.</p><div class="action-row">${button(a().finished?'Ver mi resultado':count()?'Continuar la jornada':'Empezar la jornada',a().finished?'page:results':'page:travel')}${button('Recuperar una copia','import','secondary')}</div></div><div class="intro-illustration" aria-hidden="true"><svg viewBox="0 0 330 240"><rect x="24" y="24" width="232" height="150" rx="13" fill="#173d31"/><rect x="36" y="36" width="208" height="120" rx="5" fill="#dbeaab"/><path d="M58 129l42-35 32 17 53-49 35 10" stroke="#173d31" stroke-width="7" fill="none" stroke-linejoin="round"/><path d="M193 62h27v27" fill="none" stroke="#173d31" stroke-width="6"/><rect x="124" y="174" width="33" height="25" fill="#173d31"/><rect x="93" y="198" width="96" height="9" rx="4" fill="#173d31"/><circle cx="266" cy="170" r="43" fill="#e7bb86"/><path d="M249 164h33l-8-9m8 9l-8 10M283 180h-33l8 9m-8-9l8-10" fill="none" stroke="#173d31" stroke-width="4" stroke-linecap="round"/></svg></div></section>
    <section class="card"><h2>El escenario</h2><div class="scenario-chips">${M.scenarioSummary.map(s=>`<span class="scenario-chip">${esc(s)}</span>`).join('')}</div><p class="small muted">Los datos del caso y los factores se mantienen iguales al repetir. La simulación orienta la comparación; no calcula una huella real ni da una nota automática.</p>${initialConfiguration()}</section>
    <section class="card"><h2>Antes de conocer los resultados</h2><p>¿Qué mejora crees que tendrá más efecto? Puedes ordenar estas cinco del mayor al menor, sin repetir posiciones. Esta predicción es opcional.</p><div class="prediction-grid">${prediction.map(([id,label])=>`<div class="field"><label for="prediction-${id}">${label}</label><select id="prediction-${id}" data-predict="${id}" ${a().finished?'disabled':''}><option value="">Sin ordenar</option>${[1,2,3,4,5].map(n=>`<option value="${n}" ${a().prediction[id]===String(n)?'selected':''}>${n===1?'Mayor efecto':n===5?'Menor efecto':'Posición '+n}</option>`).join('')}</select></div>`).join('')}</div><p class="small muted">No hay una clasificación universal. Compararemos tu intuición con el resultado de este escenario concreto.</p></section>

  function mass(n){const abs=Math.abs(n);return abs<1?`${number(n*1000,abs<0.01?2:1)} g`:`${number(n,abs<10?2:1)} kg`;}

  function comparison(current,previous){

    const before=sum(previous.calculation.rows,'chosen'),now=sum(current.calculation.rows,'chosen'),diff=before-now;

    const changes=keys.filter(k=>current.answers[k]!==previous.answers[k]);
    return `<section class="card comparison-card"><div class="eyebrow">MISMO ESCENARIO · MISMO MODELO</div><h2>Tu anterior simulación y la actual</h2><div class="feedback-grid"><div class="metric"><span>Simulación anterior</span><strong class="metric-value">${mass(before)}</strong><span>CO₂e al año · conjunto modelado</span></div><div class="metric"><span>Simulación actual</span><strong class="metric-value">${mass(now)}</strong><span>CO₂e al año · conjunto modelado</span></div></div><p class="comparison-delta">${diff===0?'El total central no ha cambiado.':diff>0?`Has reducido ${mass(diff)} de CO₂e al año${pct?' ('+pct+')':''}.`:`El total aumenta ${mass(-diff)} de CO₂e al año${pct?' ('+pct+')':''}.`}</p><p class="small muted">La diferencia es entre estimaciones centrales. Los intervalos del modelo y las condiciones de servicio siguen siendo relevantes.</p><div class="table-wrap"><table class="data-table"><thead><tr><th>Parte del caso</th><th>Anterior</th><th>Actual</th><th>Cambio central</th></tr></thead><tbody>${current.calculation.rows.map(r=>{const p=previous.calculation.rows.find(x=>x.id===r.id);return `<tr><th scope="row">${esc(r.label)}</th><td>${p?mass(p.chosen.central):'No comparable'}</td><td>${mass(r.chosen.central)}</td><td>${p?savingsCell(p.chosen.central-r.chosen.central):'—'}</td></tr>`;}).join('')}</tbody></table></div><h3>Qué has cambiado</h3>${changes.length?`<ul>${changes.map(k=>`<li><strong>${esc(M.decisions[k].title)}</strong><br><span class="muted">${esc(label(k,previous.answers[k]))}</span> → ${esc(label(k,current.answers[k]))}</li>`).join('')}</ul>`:'<p>Has elegido las mismas alternativas en ambos intentos. Las explicaciones y prioridades pueden seguir siendo distintas.</p>'}<p class="small">Las mejoras de la aplicación se comparan juntas: no atribuimos el mismo ahorro dos veces a transferencia, solicitudes y procesamiento.</p></section>`;
  }
  function checks(result){return `<section class="card"><h2>Las condiciones también cuentan</h2><div class="checks-list">${result.checks.map(c=>`<div class="check-item ${c.status==='ok'?'check-ok':'check-review'}"><span class="check-icon" aria-hidden="true">${c.status==='ok'?'✓':'!'}</span><div><h3>${esc(c.label)}</h3><p>${esc(c.message)}</p></div></div>`).join('')}</div><p class="small muted">La gestión de RAEE se valora aquí. No se asigna un ahorro climático de cero ni una cifra inventada a esas dos decisiones.</p></section>`;}
  function explanations(rows){return `<section class="card"><h2>De dónde sale cada resultado</h2>${rows.map(r=>`<details class="resource"><summary>${esc(r.label)}</summary><p>${esc(r.explanation)}</p><p class="small">${r.sourceIds.map(id=>{const s=M.sources.find(x=>x.id===id);return s?.url?`<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.label)}</a>`:esc(s?.label||id);}).join(' · ')}</p></details>`).join('')}</section>`;}
  function resultReflections(record){
    const choices=record.calculation.rows.map(r=>[r.id,r.label]).concat([['reuse','Segundo uso de equipos'],['waste','Gestión de RAEE']]);
    return `<section class="card"><h2>Si puedes impulsar tres cambios…</h2><p>Escoge tus prioridades después de ver los resultados. Puedes valorar también una obligación ambiental que no tenga cifra de carbono.</p><div class="prediction-grid">${[0,1,2].map(i=>`<div class="field"><label for="priority-${i}">Prioridad ${i+1}</label><select id="priority-${i}" data-reflection-priority="${i}"><option value="">Elige una actuación</option>${choices.map(([id,label])=>`<option value="${esc(id)}" ${record.reflection.priorities[i]===id?'selected':''}>${esc(label)}</option>`).join('')}</select></div>`).join('')}</div><div class="field"><label for="final-reason">¿Qué datos justifican tus prioridades y quién puede aplicarlas?</label><textarea id="final-reason" data-reflection="reason" rows="3" maxlength="4000">${esc(record.reflection.reason)}</textarea></div><div class="field"><label for="final-robust">¿Qué prioridad mantendrías si cambiasen los supuestos?</label><textarea id="final-robust" data-reflection="robust" rows="2" maxlength="4000">${esc(record.reflection.robust)}</textarea></div><p class="small muted">Las respuestas se incorporan automáticamente al informe. No son necesarias para poder imprimirlo.</p></section>`;
  }

  function initialOverview(record){
    const rows=record.calculation.rows,ref=sum(rows,'reference'),chosen=sum(rows,'chosen'),saved=ref-chosen;
    return `<section class="card report-cover"><div class="feedback-grid"><div class="metric"><span>Configuración inicial del caso</span><strong class="metric-value">${mass(ref)}</strong><span>CO₂e al año</span></div><div class="metric"><span>Tus elecciones</span><strong class="metric-value">${mass(chosen)}</strong><span>CO₂e al año</span></div></div><p class="comparison-delta">${Math.abs(saved)<1e-9?'El total central coincide con la configuración inicial.':saved>0?mass(saved)+' de CO₂e menos al año frente a la configuración inicial.':mass(-saved)+' de CO₂e más al año frente a la configuración inicial.'}</p><p>La configuración inicial es una combinación ficticia de decisiones elegida para este ejercicio. No representa una empresa observada ni una media española.</p>${initialConfiguration()}<p class="small">El conjunto incluye un trayecto y un puesto individuales, una sala compartida, un servicio digital completo y fabricación anualizada. No es un inventario de toda la empresa.</p></section>`;
  }
  function results(){
    const record=state.lastCompleted;if(!a().finished||!record)return '';
    const rows=record.calculation.rows,view=displayRows(record),from=baseLabel(record),hasPrevious=state.reference&&sameScenario(record,state.reference);
    const ranked=[...view].sort((x,y)=>Math.abs(y.reference.central-y.chosen.central)-Math.abs(x.reference.central-x.chosen.central));
    const top=ranked.filter(r=>Math.abs(r.reference.central-r.chosen.central)>1e-9).slice(0,3);
    const headline=hasPrevious?'Tu simulación anterior<br><em>y tus nuevas elecciones.</em>':'Ahora sí:<br><em>¿qué ha pesado más?</em>';
    return hero('RESULTADOS · MISMO HORIZONTE ANUAL',headline,hasPrevious?'La comparación principal usa tu anterior simulación terminada, con las mismas condiciones y factores. La configuración inicial del ejercicio permanece disponible como detalle.':'Compara tus elecciones con una configuración inicial ficticia y explícita del ejercicio. Son estimaciones educativas y parciales, no una huella real.','▥')+
      (hasPrevious?comparison(record,state.reference)+'<details class="resource initial-comparison"><summary>Comparar también con la configuración inicial del caso</summary>'+initialOverview(record)+'</details>':initialOverview(record)+comparison(record,state.reference))+
      '<section class="card"><h2>El peso de tus decisiones</h2>'+bars(view,from)+resultTable(view,true,from)+'<p class="small muted">Cambio central respecto a '+esc(from.toLowerCase())+': «−» representa menos emisiones; «+», más. Un intervalo no equivale a una medición real.</p></section>'+
      '<section class="card"><h2>Qué decisiones explican las diferencias</h2>'+(top.length?'<ol class="impact-ranking">'+top.map(r=>{const d=r.reference.central-r.chosen.central;return '<li><strong>'+esc(r.label)+'</strong><span>'+mass(Math.abs(d))+' de CO₂e '+(d>0?'menos':'más')+' al año</span></li>';}).join('')+'</ol>':'<p>Las emisiones centrales de tus elecciones coinciden con '+esc(from.toLowerCase())+'.</p>')+'<p class="small">Diferencias respecto a '+esc(from.toLowerCase())+', con la población y frecuencia del caso. No es un orden universal de importancia.</p>'+
      (Object.values(record.prediction).some(Boolean)?'<h3>Tu predicción inicial</h3><ul>'+prediction.filter(([id])=>record.prediction[id]).sort((x,y)=>Number(record.prediction[x[0]])-Number(record.prediction[y[0]])).map(([id,label])=>'<li>'+esc(label)+' · posición '+esc(record.prediction[id])+'</li>').join('')+'</ul><p>¿Qué intuición mantienes y cuál revisarías ahora?</p>':'')+'</section>'+
      checks(record.calculation)+explanations(rows)+'<section class="card"><h2>Supuestos que delimitan la comparación</h2><ul>'+record.calculation.notes.map(n=>'<li>'+esc(n)+'</li>').join('')+'</ul></section>'+resultReflections(record)+
      '<section class="card"><h2>Conservar, imprimir y volver a probar</h2><p>El informe reúne automáticamente el escenario, las elecciones, sus resultados y, si existe, la comparación con el intento anterior.</p><div class="export-row">'+button('Imprimir / guardar PDF','print')+button('Ver informe / copiar','report','secondary')+button('Guardar copia recuperable','save-copy','secondary')+button('Repetir simulación y comparar','repeat-dialog','secondary')+button('Cambiar la escala','page:explore','ghost')+'</div><p class="small muted">Esta versión conserva sus propios intentos en este navegador. No modifica los registros de la versión anterior. Para otro dispositivo, utiliza una copia recuperable.</p></section>';
  }

  function explore(){
    const record=state.lastCompleted;if(!record)return '';
    const exp=M.calculate(record.answers,experiment),base=record.calculation;
    return `${hero('EXPERIMENTO · NO MODIFICA TUS INTENTOS','¿Y si cambia<br>la escala?','Aquí varían las condiciones. Este experimento se mantiene separado de las dos simulaciones comparables.','↔')}<section class="card"><h2>Cambia un supuesto cada vez</h2><div class="form-grid"><div class="field"><label for="experiment-users">Usuarios diarios de la aplicación</label><select id="experiment-users" data-experiment="appUsers">${[10,100,1000,10000,100000].map(n=>`<option value="${n}" ${experiment.appUsers===n?'selected':''}>${number(n,0)} usuarios</option>`).join('')}</select></div><div class="field"><label for="experiment-days">Días de actividad al año</label><select id="experiment-days" data-experiment="workdays">${[100,180,220,260].map(n=>`<option value="${n}" ${experiment.workdays===n?'selected':''}>${n} días</option>`).join('')}</select></div></div><p class="small muted">Escenario guardado: ${number(M.scenario.appUsers,0)} usuarios diarios y ${M.scenario.workdays} días. Tus resultados anteriores no se recalculan ni se sustituyen.</p>${button('Volver a las condiciones del caso','reset-experiment','secondary')}</section><section class="card"><h2>Qué cambia con estas condiciones</h2><div class="table-wrap"><table class="data-table"><thead><tr><th>Parte del caso</th><th>Tu simulación guardada</th><th>Experimento</th></tr></thead><tbody>${exp.rows.map(r=>{const old=base.rows.find(x=>x.id===r.id);return `<tr><th scope="row">${esc(r.label)}</th><td>${old?mass(old.chosen.central):'—'}</td><td>${range(r.chosen)}</td></tr>`;}).join('')}</tbody></table></div><p>¿Qué decisiones ganan importancia cuando la aplicación crece? ¿Cuáles dependen principalmente del tiempo de uso?</p></section><div class="next-row">${button('Volver al resultado guardado','page:results')}</div>`;
  }
  function validatePage(){
    capture();const missing=(pageKeys[a().page]||[]).filter(k=>!a().answers[k]);
    if(missing.length){$('scene-error').textContent='Queda una decisión por responder en esta pantalla.';$('scene-error').hidden=false;document.querySelector(`[data-answer="${missing[0]}"]`)?.focus();return false;}return true;
  }
  function finish(){
    capture();const missing=keys.filter(k=>!a().answers[k]);
    if(missing.length){go(M.decisions[missing[0]].page);$('scene-error').textContent='Completa las decisiones pendientes antes de ver los resultados.';$('scene-error').hidden=false;return;}
    try{
      const calculation=checkResult(M.calculate(copy(a().answers)));
      const record={id:a().id,completedAt:new Date().toISOString(),modelVersion:M.version,scenario:copy(M.scenario),answers:copy(a().answers),reasons:copy(a().reasons),prediction:copy(a().prediction),calculation,sources:copy(M.sources),reflection:copy(a().reflection)};
      state.lastCompleted=record;a().finished=true;a().page='results';render();window.scrollTo(0,0);$('scene').querySelector('h1')?.focus({preventScroll:true});history.replaceState(null,'','#results');toast('Simulación terminada y guardada.');
    }catch(e){toast('No se han podido generar los resultados. Tus elecciones se conservan.');console.error(e);}
  }
  function modal(title,body){$('modal').innerHTML=`<h2 id="modal-title">${title}</h2>${body}`;$('modal').showModal();}
  function repeatDialog(){
    if(!state.lastCompleted)return restartDialog();
    modal('Repetir simulación y comparar',`<p>Conservaremos el último resultado terminado. Empezarás con respuestas, predicción y progreso vacíos, bajo las mismas condiciones y factores.</p><p>Si cierras a mitad, podrás continuar sin perder el resultado anterior.</p><div class="modal-actions">${button('Cancelar','close-modal','secondary')}${button('Empezar nueva pasada','repeat-confirm')}</div>`);
  }
  function restartDialog(){
    if(a().finished)return repeatDialog();
    modal('Reiniciar el recorrido actual',`<p>Se vaciarán las elecciones y textos de este recorrido. ${state.reference?'La simulación anterior usada como referencia se conservará.':'Puedes guardar una copia antes de continuar.'}</p><div class="modal-actions">${button('Guardar copia','save-copy','secondary')}${button('Cancelar','close-modal','secondary')}${button('Reiniciar recorrido','restart-confirm')}</div>`);
  }
  function repeat(){
    if(!state.lastCompleted)return;
    state.reference=copy(state.lastCompleted);state.active=newAttempt();blocked=false;$('print-report').innerHTML='';$('modal').close();render();window.scrollTo(0,0);history.replaceState(null,'','#intro');toast('Anterior conservada. Nueva simulación preparada.');
  }
  function sources(){
    modal('Fuentes y supuestos del escenario',`<p>Modelo educativo con factores publicados y supuestos fijos. Las dos simulaciones usan los mismos valores; el experimento de escala es independiente.</p><ul>${M.scenarioSummary.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>${M.sources.map(s=>`<div class="source-entry"><h3>${s.url?`<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.label)} ↗</a>`:esc(s.label)}</h3><p>${esc(s.note)}</p></div>`).join('')}<div class="modal-actions">${button('Volver a la jornada','close-modal')}</div>`);
  }
  function reportText(){
    const current=state.lastCompleted;if(!current)return 'La simulación todavía no ha terminado.';
    const r=current.calculation,view=displayRows(current),from=baseLabel(current);
    const lines=['UNA JORNADA INFORMÁTICA · INFORME EDUCATIVO',new Date(current.completedAt).toLocaleString('es-ES',{timeZone:'Europe/Madrid'}),'Estimaciones orientativas en CO₂ equivalente. No es una huella real ni una calificación.','',...M.scenarioSummary,'','RESULTADOS ANUALES DEL CONJUNTO MODELADO',`${from}: ${mass(sum(view,'reference'))} CO₂e/año.`,`Tu elección: ${mass(sum(r.rows,'chosen'))} CO₂e/año.`,''];
    for(const row of view)lines.push(row.label,row.scope,`${from}: ${mass(row.reference.central)}. Elegido: ${mass(row.chosen.central)}. Intervalo: ${mass(row.chosen.low)}–${mass(row.chosen.high)} CO₂e/año.`,row.explanation,'');
    if(state.reference){lines.push('COMPARACIÓN CON LA SIMULACIÓN ANTERIOR');if(sameScenario(current,state.reference)){const before=sum(state.reference.calculation.rows,'chosen'),now=sum(r.rows,'chosen');lines.push(`Anterior: ${mass(before)}. Actual: ${mass(now)}. Diferencia: ${mass(before-now)} CO₂e/año (positivo: reducción).`);for(const key of keys)if(current.answers[key]!==state.reference.answers[key])lines.push(`${M.decisions[key].title}: ${label(key,state.reference.answers[key])} → ${label(key,current.answers[key])}`);}else lines.push('Escenario o modelo diferente: no se calcula una mejora directa.');lines.push('');}
    lines.push('ELECCIONES Y ARGUMENTOS');for(const key of keys)lines.push(M.decisions[key].title,label(key,current.answers[key]),current.reasons[key]?'Motivo: '+current.reasons[key]:'Sin justificación escrita.','');
    lines.push('CONDICIONES Y GESTIÓN DE EQUIPOS');for(const c of r.checks)lines.push(`${c.status==='ok'?'Conforme al caso':'Revisar'} · ${c.label}: ${c.message}`);
    lines.push('','PRIORIDADES FINALES');const names=Object.fromEntries(r.rows.map(x=>[x.id,x.label]));names.reuse='Segundo uso';names.waste='Gestión de RAEE';current.reflection.priorities.forEach((id,i)=>lines.push(`${i+1}. ${names[id]||'Sin indicar'}`));lines.push(current.reflection.reason||'Sin justificación final.',current.reflection.robust||'Sin reflexión sobre los supuestos.','','LÍMITES Y SUPUESTOS',...r.notes,'','FUENTES');for(const source of current.sources)lines.push(source.label,source.url,source.note,'');return lines.join('\n');
  }
  function printMarkup(){
    const r=state.lastCompleted;if(!a().finished||!r)return '<h1>Una jornada informática</h1><p>Completa el recorrido para generar el informe de resultados.</p>';
    return `<header><p class="eyebrow">SOS · INFORME DE LA SIMULACIÓN</p><h1>Una jornada informática</h1><p>${esc(new Date(r.completedAt).toLocaleString('es-ES',{timeZone:'Europe/Madrid'}))}</p><p>Estimación educativa. No es una huella real ni una calificación.</p></header><section><h2>Escenario y alcance</h2><ul>${M.scenarioSummary.map(s=>`<li>${esc(s)}</li>`).join('')}</ul><p>Conjunto parcial: un trayecto y puesto individuales, sala compartida, aplicación completa y fabricación anualizada. Los alcances de cada fila son distintos y explícitos.</p></section>${state.reference?comparison(r,state.reference):''}<section><h2>Resultados frente a ${esc(baseLabel(r).toLowerCase())}</h2>${resultTable(displayRows(r),true,baseLabel(r))}</section><section><h2>Configuración inicial del ejercicio</h2><p>Combinación ficticia definida para el caso, no una media real. Su total central es ${mass(sum(r.calculation.rows,'reference'))} CO₂e al año.</p></section><section><h2>Elecciones y argumentos</h2>${keys.map(k=>`<div class="print-choice"><h3>${esc(M.decisions[k].title)}</h3><p><strong>${esc(label(k,r.answers[k]))}</strong></p>${r.reasons[k]?`<p>${esc(r.reasons[k])}</p>`:''}</div>`).join('')}</section>${checks(r.calculation)}<section><h2>Prioridades y reflexión</h2><ol>${r.reflection.priorities.map(id=>`<li>${esc(r.calculation.rows.find(x=>x.id===id)?.label||(id==='reuse'?'Segundo uso':id==='waste'?'Gestión de RAEE':'Sin indicar'))}</li>`).join('')}</ol><p>${esc(r.reflection.reason||'Sin justificación escrita.')}</p><p>${esc(r.reflection.robust||'Sin reflexión adicional.')}</p></section><section><h2>De dónde salen las cifras</h2>${r.calculation.rows.map(x=>`<h3>${esc(x.label)}</h3><p>${esc(x.explanation)}</p>`).join('')}<h2>Límites</h2><ul>${r.calculation.notes.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></section><section><h2>Fuentes</h2>${r.sources.map(s=>`<p><strong>${esc(s.label)}</strong><br>${esc(s.url)}<br>${esc(s.note)}</p>`).join('')}</section>`;
  }
  function reportDialog(){modal('Informe automatizado',`<div class="field"><label for="report-text">Puedes leerlo o copiarlo</label><textarea id="report-text" rows="16" readonly>${esc(reportText())}</textarea></div><div class="modal-actions">${button('Seleccionar texto','select-report','secondary')}${button('Imprimir / guardar PDF','print','secondary')}${button('Cerrar','close-modal')}</div>`);}
  function copyDialog(){
    capture();persist();
    modal('Guardar una copia recuperable',`<p>La copia incluye el recorrido actual y los resultados conservados. Sirve para recuperarlos en este u otro navegador.</p><div class="modal-actions">${button('Descargar copia JSON','download-copy')}${button('Ver texto de la copia','show-json','secondary')}${button('Recuperar un archivo','import','secondary')}${button('Cerrar','close-modal','secondary')}</div>`);
  }
  function download(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),el=document.createElement('a');el.href=url;el.download='SOS_simulaciones_v2.json';document.body.appendChild(el);el.click();el.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('Copia preparada para descargar. También puedes ver su texto.');}
  function updateReflection(target){
    if(!a().finished||!state.lastCompleted)return;
    const r=state.lastCompleted.reflection;
    if(target.dataset.reflectionPriority!=null)r.priorities[Number(target.dataset.reflectionPriority)]=target.value;
    if(target.dataset.reflection)r[target.dataset.reflection]=target.value;
    a().reflection=copy(r);persist();
  }
  function action(name){
    if(name==='close-modal')return $('modal').close();
    if(name==='select-report'){$('report-text').focus();$('report-text').select();toast('Texto seleccionado. Usa Copiar o Ctrl+C.');return;}
    if(name==='sources')return sources();
    if(name==='restart-dialog')return restartDialog();
    if(name==='repeat-dialog')return repeatDialog();
    if(name==='repeat-confirm')return repeat();
    if(name==='restart-confirm'){state.active=newAttempt();blocked=false;$('print-report').innerHTML='';$('modal').close();render();history.replaceState(null,'','#intro');window.scrollTo(0,0);return;}
    if(name.startsWith('page:'))return go(name.slice(5));
    if(name.startsWith('next:')){if(validatePage())go(name.slice(5));return;}
    if(name==='finish')return finish();
    if(name==='reset-experiment'){experiment={appUsers:M.scenario.appUsers,workdays:M.scenario.workdays};render();return;}
    if(name==='save-copy')return copyDialog();
    if(name==='download-copy')return download();
    if(name==='show-json'){modal('Texto de la copia recuperable',`<div class="field"><label for="report-text">Copia el texto completo para conservarlo en un archivo .json</label><textarea id="report-text" rows="15" readonly>${esc(JSON.stringify(state,null,2))}</textarea></div><div class="modal-actions">${button('Seleccionar texto','select-report','secondary')}${button('Cerrar','close-modal')}</div>`);return;}
    if(name==='import'){$('import-file').value='';$('import-file').click();return;}
    if(name==='report')return reportDialog();
    if(name==='print'){if(!a().finished){toast('Termina la simulación para imprimir el informe.');return;}$('print-report').innerHTML=printMarkup();window.print();return;}
  }
  document.addEventListener('click',event=>{const target=event.target.closest('[data-action],[data-page]');if(!target)return;if(target.dataset.action)action(target.dataset.action);else if(target.dataset.page)go(target.dataset.page);});
  document.addEventListener('input',event=>{
    const target=event.target;
    if(target.matches('[data-answer],[data-reason],[data-predict]')){
      capture();
      if(target.dataset.answer){const key=target.dataset.answer;document.querySelectorAll(`[data-answer="${key}"]`).forEach(r=>r.closest('.option-card').classList.toggle('selected',r.checked));const status=document.querySelector(`[data-status="${key}"]`);if(status)status.textContent='Elección guardada. El resultado se mostrará al final.';$('scene-error')?.setAttribute('hidden','');$('progress-label').textContent=`${count()} de ${keys.length} decisiones registradas`;$('progress-fill').style.width=count()/keys.length*100+'%';$('progress').setAttribute('aria-valuenow',count());renderSide();}
      if(target.dataset.predict){const used=Object.values(a().prediction).filter(Boolean);if(new Set(used).size!==used.length)toast('Hay posiciones repetidas en tu predicción. Puedes corregirlas o dejarlas sin ordenar.');}
      clearTimeout(saveTimer);saveTimer=setTimeout(persist,200);
    }
    if(target.matches('[data-reflection],[data-reflection-priority]'))updateReflection(target);
  });
  document.addEventListener('change',event=>{
    if(event.target.matches('[data-predict]')){capture();persist();}
    if(event.target.matches('[data-reflection-priority]'))updateReflection(event.target);
    if(event.target.matches('[data-experiment]')){experiment[event.target.dataset.experiment]=Number(event.target.value);render();}
  });
  $('import-file').addEventListener('change',async event=>{
    const file=event.target.files[0];if(!file)return;if(file.size>2000000){toast('El archivo supera el tamaño previsto para estas simulaciones.');return;}
    try{
      const incoming=validate(JSON.parse(await file.text()));
      modal('Recuperar una copia',`<p>Se recuperará el recorrido y ${incoming.lastCompleted?'su resultado terminado':'el progreso guardado'}${incoming.reference?', con la referencia anterior':''}. Sustituirá lo que hay ahora en este navegador.</p><div class="modal-actions">${button('Guardar copia actual','save-copy','secondary')}${button('Cancelar','close-modal','secondary')}<button type="button" class="btn primary" id="accept-import">Recuperar copia</button></div>`);
      $('accept-import').addEventListener('click',()=>{state=incoming;blocked=false;$('modal').close();render();history.replaceState(null,'',`#${a().page}`);window.scrollTo(0,0);toast('Simulaciones recuperadas.');},{once:true});
    }catch(e){toast('No se ha recuperado el archivo: '+e.message);}
  });
  window.addEventListener('beforeunload',()=>{capture();persist();});
  window.addEventListener('beforeprint',()=>{$('print-report').innerHTML=printMarkup();});
  window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(pages.some(p=>p.id===id)&&id!==a().page)go(id);});
  const initial=location.hash.slice(1);if(pages.some(p=>p.id===initial)&&(!['results','explore'].includes(initial)||a().finished))a().page=initial;
  render();
})();
</script>
</body>
</html>
